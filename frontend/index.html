<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fractala</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, sans-serif;
        background-color: #1e1e1e;
        color: #d4d4d4;
        height: 100vh;
        overflow: hidden;
      }

      .app-container {
        display: flex;
        height: 100vh;
      }

      .left-panel {
        width: 400px;
        background-color: #252526;
        border-right: 1px solid #3e3e42;
        display: flex;
        flex-direction: column;
        padding: 20px;
        overflow-y: auto;
      }

      .right-panel {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #1e1e1e;
        padding: 20px;
      }

      h2 {
        margin-top: 0;
        margin-bottom: 15px;
        font-size: 1.3rem;
        color: #61afef;
        font-weight: 600;
      }

      h3 {
        font-size: 1rem;
        color: #98c379;
        margin-bottom: 10px;
        margin-top: 15px;
      }

      .code-editor {
        width: 100%;
        height: 500px;
        min-height: 280px;
        background-color: #1e1e1e;
        color: #dcdcaa;
        border: 1px solid #3e3e42;
        border-radius: 4px;
        padding: 12px;
        font-family: "Courier New", "Consolas", monospace;
        font-size: 14px;
        line-height: 1.5;
        resize: vertical;
        outline: none;
        margin-bottom: 15px;
        transition: border-color 0.3s;
      }

      .code-editor:focus {
        border-color: #61afef;
        box-shadow: 0 0 0 2px rgba(97, 175, 239, 0.1);
      }

      .btn-primary {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #0e639c 0%, #1177bb 100%);
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        margin-top: 15px;
      }

      .btn-primary:hover {
        background: linear-gradient(135deg, #1177bb 0%, #0e639c 100%);
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(17, 119, 187, 0.4);
      }

      .btn-primary:active {
        transform: translateY(0);
      }

      .btn-primary:disabled {
        background: #555;
        cursor: not-allowed;
        transform: none;
        opacity: 0.7;
      }

      .preset-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 10px;
      }

      .btn-preset {
        padding: 10px;
        background-color: #2d2d30;
        color: #98c379;
        border: 1px solid #3e3e42;
        border-radius: 4px;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.2s;
        font-weight: 500;
      }

      .btn-preset:hover {
        background-color: #3e3e42;
        border-color: #98c379;
        transform: translateY(-1px);
      }

      .error-msg {
        color: #f48771;
        background-color: rgba(244, 135, 113, 0.1);
        border-left: 3px solid #f48771;
        padding: 10px;
        margin-bottom: 12px;
        font-size: 13px;
        border-radius: 4px;
        min-height: 20px;
        white-space: pre-wrap;
        display: none;
      }

      .error-msg:not(:empty) {
        display: block;
      }

      .status-msg {
        color: #98c379;
        background-color: rgba(152, 195, 121, 0.1);
        border-left: 3px solid #98c379;
        padding: 10px;
        margin-top: 12px;
        font-size: 13px;
        border-radius: 4px;
        min-height: 20px;
        display: none;
      }

      .status-msg:not(:empty) {
        display: block;
      }

      #fractalCanvas {
        background-color: white;
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        max-width: 100%;
        max-height: 90vh;
      }

      /* Scrollbar styling */
      .left-panel::-webkit-scrollbar {
        width: 8px;
      }

      .left-panel::-webkit-scrollbar-track {
        background: #1e1e1e;
      }

      .left-panel::-webkit-scrollbar-thumb {
        background: #3e3e42;
        border-radius: 4px;
      }

      .left-panel::-webkit-scrollbar-thumb:hover {
        background: #4e4e52;
      }

      /* Loading animation */
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .btn-primary:disabled {
        animation: pulse 1.5s ease-in-out infinite;
      }

      /* Responsive design */
      @media (max-width: 1024px) {
        .app-container {
          flex-direction: column;
        }

        .left-panel {
          width: 100%;
          max-height: 50vh;
          border-right: none;
          border-bottom: 1px solid #3e3e42;
        }

        .right-panel {
          flex: 1;
          padding: 10px;
        }
      }
    </style>
  </head>
  <body>
    <script type="module" src="/main.js"></script>
  </body>
</html>
