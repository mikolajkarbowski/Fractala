<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fractala</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, sans-serif;
        background-color: #1e1e1e;
        color: #d4d4d4;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* Top navigation */
      .nav-bar {
        display: flex;
        align-items: center;
        gap: 24px;
        flex: 0 0 56px;
        padding: 0 24px;
        background-color: #2d2d30;
        border-bottom: 1px solid #3e3e42;
      }

      .nav-brand {
        font-size: 1.2rem;
        font-weight: 700;
        color: #61afef;
        letter-spacing: 0.5px;
      }

      .nav-tabs {
        display: flex;
        gap: 8px;
      }

      .nav-tab {
        padding: 8px 16px;
        color: #b0b3b8;
        text-decoration: none;
        border-radius: 6px;
        font-size: 0.95rem;
        font-weight: 500;
        transition: background-color 0.2s, color 0.2s;
      }

      .nav-tab:hover {
        background-color: #3e3e42;
        color: #d4d4d4;
      }

      .nav-tab.active {
        background-color: #0e639c;
        color: #ffffff;
      }

      /* Page container */
      #app-content {
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }

      .app-container {
        display: flex;
        height: 100%;
      }

      .left-panel {
        width: 400px;
        background-color: #252526;
        border-right: 1px solid #3e3e42;
        display: flex;
        flex-direction: column;
        padding: 20px;
        overflow-y: auto;
      }

      /* Keep panel children at their natural height so the panel scrolls instead of
         compressing items — this previously cut off the error box on short/narrow windows. */
      .left-panel > * {
        flex-shrink: 0;
      }

      .right-panel {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #1e1e1e;
        padding: 20px;
      }

      h2 {
        margin-top: 0;
        margin-bottom: 15px;
        font-size: 1.3rem;
        color: #61afef;
        font-weight: 600;
      }

      h3 {
        font-size: 1rem;
        color: #98c379;
        margin-bottom: 10px;
        margin-top: 15px;
      }

      /* Editor: a transparent textarea sitting on top of a highlight backdrop. */
      .editor-wrap {
        position: relative;
        margin-bottom: 10px;
      }

      .editor-highlights {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        margin: 0;
        padding: 12px;
        border: 1px solid transparent;
        border-radius: 4px;
        background-color: #1e1e1e;
        color: transparent;
        font-family: "Courier New", "Consolas", monospace;
        font-size: 14px;
        line-height: 1.5;
        white-space: pre-wrap;
        overflow-wrap: break-word;
        word-break: break-word;
        overflow: hidden;
        pointer-events: none;
        box-sizing: border-box;
        z-index: 0;
      }

      .editor-highlights .error-highlight {
        background-color: rgba(244, 135, 113, 0.35);
        border-bottom: 2px solid #f48771;
        border-radius: 2px;
      }

      .code-editor {
        position: relative;
        z-index: 1;
        display: block;
        width: 100%;
        height: 500px;
        min-height: 280px;
        background-color: transparent;
        color: #dcdcaa;
        border: 1px solid #3e3e42;
        border-radius: 4px;
        padding: 12px;
        font-family: "Courier New", "Consolas", monospace;
        font-size: 14px;
        line-height: 1.5;
        white-space: pre-wrap;
        overflow-wrap: break-word;
        word-break: break-word;
        box-sizing: border-box;
        resize: vertical;
        outline: none;
        transition: border-color 0.3s;
      }

      .code-editor:focus {
        border-color: #61afef;
        box-shadow: 0 0 0 2px rgba(97, 175, 239, 0.1);
      }

      .editor-toolbar {
        display: flex;
        gap: 8px;
        margin-bottom: 6px;
      }

      .btn-secondary {
        padding: 8px 14px;
        background-color: #2d2d30;
        color: #d4d4d4;
        border: 1px solid #3e3e42;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.2s, border-color 0.2s;
      }

      .btn-secondary:hover {
        background-color: #3e3e42;
        border-color: #61afef;
      }

      .btn-secondary:active {
        transform: translateY(1px);
      }

      .btn-primary {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #0e639c 0%, #1177bb 100%);
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        margin-top: 15px;
      }

      .btn-primary:hover {
        background: linear-gradient(135deg, #1177bb 0%, #0e639c 100%);
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(17, 119, 187, 0.4);
      }

      .btn-primary:active {
        transform: translateY(0);
      }

      .btn-primary:disabled {
        background: #555;
        cursor: not-allowed;
        transform: none;
        opacity: 0.7;
      }

      .error-msg {
        color: #f48771;
        background-color: rgba(244, 135, 113, 0.1);
        border-left: 3px solid #f48771;
        padding: 10px;
        margin-bottom: 12px;
        font-size: 13px;
        border-radius: 4px;
        min-height: 20px;
        white-space: pre-wrap;
        display: none;
      }

      .error-msg:not(:empty) {
        display: block;
      }

      .error-title {
        font-weight: 600;
        font-size: 14px;
        margin-bottom: 4px;
        color: #f48771;
      }

      .error-loc {
        font-family: "Courier New", "Consolas", monospace;
        font-size: 12px;
        color: #ffb3a0;
        margin-bottom: 6px;
      }

      .error-detail {
        margin: 0;
        font-family: "Courier New", "Consolas", monospace;
        font-size: 12px;
        line-height: 1.45;
        white-space: pre-wrap;
        overflow-wrap: break-word;
        color: #e6b0a6;
      }

      .status-msg {
        color: #98c379;
        background-color: rgba(152, 195, 121, 0.1);
        border-left: 3px solid #98c379;
        padding: 10px;
        margin-top: 12px;
        font-size: 13px;
        border-radius: 4px;
        min-height: 20px;
        display: none;
      }

      .status-msg:not(:empty) {
        display: block;
      }

      .canvas-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        max-width: 100%;
        max-height: 100%;
      }

      .canvas-toolbar {
        width: 100%;
        display: flex;
        justify-content: flex-end;
      }

      #fractalCanvas {
        background-color: white;
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        max-width: 100%;
        max-height: calc(100vh - 160px);
      }

      /* Examples gallery */
      .examples-page {
        height: 100%;
        overflow-y: auto;
        padding: 30px 40px;
      }

      .examples-page h2 {
        font-size: 1.8rem;
        margin-bottom: 6px;
      }

      .examples-subtitle {
        color: #9aa0a6;
        margin-bottom: 24px;
        font-size: 0.95rem;
      }

      .examples-status {
        color: #9aa0a6;
        padding: 16px 0;
        font-size: 0.95rem;
      }

      .examples-status.examples-error {
        color: #f48771;
      }

      .examples-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
        padding-bottom: 30px;
      }

      .example-card {
        background-color: #252526;
        border: 1px solid #3e3e42;
        border-radius: 10px;
        overflow: hidden;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      }

      .example-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        border-color: #61afef;
      }

      .example-card-image {
        width: 100%;
        aspect-ratio: 1 / 1;
        background-color: #1e1e1e;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .example-card-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .example-card-image.no-image::after {
        content: "No preview";
        color: #5a5a5a;
        font-size: 0.9rem;
      }

      .example-card-body {
        padding: 16px;
      }

      .example-card-title {
        color: #61afef;
        margin: 0 0 8px;
        font-size: 1.1rem;
      }

      .example-card-desc {
        color: #b0b3b8;
        font-size: 0.85rem;
        line-height: 1.5;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      /* Scrollbar styling */
      .left-panel::-webkit-scrollbar,
      .examples-page::-webkit-scrollbar {
        width: 8px;
      }

      .left-panel::-webkit-scrollbar-track,
      .examples-page::-webkit-scrollbar-track {
        background: #1e1e1e;
      }

      .left-panel::-webkit-scrollbar-thumb,
      .examples-page::-webkit-scrollbar-thumb {
        background: #3e3e42;
        border-radius: 4px;
      }

      .left-panel::-webkit-scrollbar-thumb:hover,
      .examples-page::-webkit-scrollbar-thumb:hover {
        background: #4e4e52;
      }

      /* Loading animation */
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .btn-primary:disabled {
        animation: pulse 1.5s ease-in-out infinite;
      }

      /* Responsive design */
      @media (max-width: 1024px) {
        .app-container {
          flex-direction: column;
        }

        .left-panel {
          width: 100%;
          max-height: 50vh;
          border-right: none;
          border-bottom: 1px solid #3e3e42;
        }

        .right-panel {
          flex: 1;
          padding: 10px;
        }

        #fractalCanvas {
          max-height: 45vh;
        }
      }
    </style>
  </head>
  <body>
    <script type="module" src="/main.js"></script>
  </body>
</html>
